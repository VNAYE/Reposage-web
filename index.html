<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Ask questions about GitHub repositories and get answers with cited sources."
    />
    <meta name="theme-color" content="#080b12" />
    <title>RepoSage</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #080b12;
        color: #edf1fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 12% 0%, #172443 0, transparent 42%),
          #080b12;
      }

      .page {
        display: flex;
        flex-direction: column;
        width: min(1440px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 20px 24px 24px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 0 0 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(20px, 3vw, 25px);
        letter-spacing: -0.03em;
      }

      .tagline {
        margin: 4px 0 0;
        color: #a4afc6;
        font-size: 14px;
      }

      .open-link {
        flex: 0 0 auto;
        padding: 9px 14px;
        border: 1px solid #344361;
        border-radius: 9px;
        color: #e4ebff;
        font-size: 14px;
        text-decoration: none;
        background: #141d2e;
      }

      .open-link:hover,
      .open-link:focus-visible {
        border-color: #7096ff;
        background: #1a2841;
      }

      main {
        flex: 1;
        min-height: 70vh;
        overflow: hidden;
        border: 1px solid #26334c;
        border-radius: 14px;
        background: #0c111b;
        box-shadow: 0 20px 70px #0006;
      }

      iframe {
        display: block;
        width: 100%;
        height: max(70vh, 640px);
        border: 0;
        background: #080b12;
      }

      @media (max-width: 600px) {
        .page {
          padding: 14px 12px 12px;
        }

        header {
          align-items: flex-start;
        }

        .tagline {
          max-width: 250px;
          font-size: 12px;
        }

        .open-link {
          padding: 8px 10px;
          font-size: 12px;
        }

        main {
          min-height: 75vh;
          border-radius: 10px;
        }

        iframe {
          height: max(75vh, 560px);
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div>
          <h1>RepoSage</h1>
          <p class="tagline">Ask questions about a GitHub repository and get cited answers.</p>
        </div>
      <main>
        <iframe
          src="https://vinay-pepakayala-reposage.hf.space"
          title="RepoSage app"
          allow="clipboard-read; clipboard-write"
          allowfullscreen
          referrerpolicy="no-referrer"
        ></iframe>
      </main>
    </div>
  </body>
</html>
