<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Ask questions about GitHub repositories and get answers with cited sources."
    />
    <meta name="theme-color" content="#080b12" />
    <title>RepoSage</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #080b12;
        color: #edf1fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #080b12;
      }

      .page {
        width: 100%;
        height: 100%;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        border: 0;
        background: #080b12;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <iframe
        src="https://vinay-pepakayala-reposage.hf.space?embed=true"
        title="RepoSage app"
        allow="clipboard-read; clipboard-write"
        allowfullscreen
        referrerpolicy="no-referrer"
      ></iframe>
    </div>
  </body>
</html>
